<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SUMO TLS Editor (basis)</title>
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Barlow+Condensed:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-deep:#0d1117; --bg-panel:#161b22; --bg-card:#1c2330; --bg-hover:#21293a;
    --border:#2d3748; --border-lit:#3d4f6a;
    --amber:#f0a500; --amber-dim:#8a5e00;
    --green:#22c55e; --green-dim:#14532d;
    --red:#ef4444; --red-dim:#7f1d1d;
    --yellow:#eab308;
    --blue:#3b82f6; --blue-dim:#1e3a8a;
    --text:#e2e8f0; --text-muted:#6b7280; --text-dim:#94a3b8;
    --mono:'Share Tech Mono',monospace; --sans:'Barlow Condensed',sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg-deep);color:var(--text);font-family:var(--sans);font-size:15px;min-height:100vh;display:flex;flex-direction:column}

  header{background:var(--bg-panel);border-bottom:1px solid var(--border);padding:0 24px;height:56px;display:flex;align-items:center;gap:16px;flex-shrink:0}
  .logo{display:flex;align-items:center;gap:10px;font-family:var(--sans);font-weight:700;font-size:18px;letter-spacing:.08em;text-transform:uppercase}
  .logo-signal{display:flex;flex-direction:column;gap:3px;padding:5px 4px;background:#111;border-radius:4px;border:1px solid var(--border)}
  .sig-dot{width:10px;height:10px;border-radius:50%}
  .sig-r{background:var(--red);box-shadow:0 0 6px var(--red)} .sig-y{background:var(--yellow)} .sig-g{background:var(--green);box-shadow:0 0 6px var(--green)}
  .logo span{color:var(--amber)}
  .header-meta{margin-left:auto;font-size:12px;color:var(--text-muted);font-family:var(--mono)}

  .toolbar{background:var(--bg-panel);border-bottom:1px solid var(--border);padding:8px 24px;display:flex;gap:10px;align-items:center;flex-shrink:0;flex-wrap:wrap}
  .btn{font-family:var(--sans);font-weight:600;font-size:13px;letter-spacing:.06em;text-transform:uppercase;padding:7px 16px;border:1px solid var(--border);border-radius:4px;cursor:pointer;background:var(--bg-card);color:var(--text-dim);transition:all .15s;display:flex;align-items:center;gap:6px}
  .btn:hover{background:var(--bg-hover);border-color:var(--border-lit);color:var(--text)}
  .btn-primary{background:var(--amber);color:#000;border-color:var(--amber);font-weight:700}
  .btn-primary:hover{background:#ffb800;color:#000}
  .btn-success{background:transparent;color:var(--green);border-color:var(--green-dim)}
  .btn-success:hover{background:var(--green-dim);border-color:var(--green)}
  .btn-danger{background:transparent;color:var(--red);border-color:var(--red-dim)}
  .btn-danger:hover{background:var(--red-dim);border-color:var(--red)}
  .btn:disabled{opacity:.35;cursor:not-allowed}
  .toolbar-sep{width:1px;height:28px;background:var(--border);margin:0 4px}
  .file-name{font-family:var(--mono);font-size:12px;color:var(--amber)}
  .tls-count-badge{font-family:var(--mono);font-size:11px;background:var(--bg-card);border:1px solid var(--border);padding:3px 10px;border-radius:12px;color:var(--text-muted)}

  .main{display:flex;flex:1;overflow:hidden}

  .panel-left{width:310px;min-width:220px;background:var(--bg-panel);border-right:1px solid var(--border);display:flex;flex-direction:column;flex-shrink:0;overflow:hidden}
  .panel-title{padding:10px 16px;font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--text-muted);border-bottom:1px solid var(--border);background:var(--bg-deep)}
  .search-wrap{padding:8px 12px;border-bottom:1px solid var(--border)}
  .search-wrap input{width:100%;background:var(--bg-deep);border:1px solid var(--border);border-radius:4px;padding:6px 10px;font-family:var(--mono);font-size:12px;color:var(--text);outline:none}
  .search-wrap input:focus{border-color:var(--amber)}
  .search-wrap input::placeholder{color:var(--text-muted)}
  .tls-list{flex:1;overflow-y:auto;padding:4px 0}
  .tls-list::-webkit-scrollbar{width:6px} .tls-list::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}

  .tls-item{padding:8px 10px;cursor:pointer;border-left:3px solid transparent;transition:all .1s;display:flex;gap:10px;align-items:center;border-bottom:1px solid rgba(45,55,72,.5)}
  .tls-item:hover{background:var(--bg-hover)}
  .tls-item.active{background:var(--bg-card);border-left-color:var(--amber)}
  .tls-item-info{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
  .tls-id{font-family:var(--mono);font-size:12px;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .tls-item.active .tls-id{color:var(--amber)}
  .tls-meta{display:flex;gap:5px;align-items:center;flex-wrap:wrap}
  .tag{background:var(--bg-deep);border:1px solid var(--border);border-radius:3px;padding:1px 5px;font-size:10px;font-family:var(--mono);color:var(--text-muted)}
  .tag-type{border-color:var(--blue-dim);color:#60a5fa} .tag-phases{border-color:var(--green-dim);color:var(--green)}

  .mini-junc{flex-shrink:0;width:68px;height:68px;background:var(--bg-deep);border:1px solid var(--border);border-radius:5px;overflow:hidden}
  .tls-item.active .mini-junc{border-color:var(--amber-dim)}
  .mini-junc svg{width:100%;height:100%;display:block}

  .drop-zone{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:32px;text-align:center;border:2px dashed var(--border);margin:16px;border-radius:8px;transition:all .2s}
  .drop-zone.drag-over{border-color:var(--amber);background:rgba(240,165,0,.05)}
  .drop-zone-icon{font-size:36px;opacity:.4}
  .drop-zone h3{font-size:15px;font-weight:600;color:var(--text-dim)}
  .drop-zone p{font-size:12px;color:var(--text-muted)}

  .panel-right{flex:1;display:flex;flex-direction:column;overflow:hidden}
  .editor-area{flex:1;overflow-y:auto;padding:20px;display:flex;flex-direction:column;gap:16px}
  .editor-area::-webkit-scrollbar{width:6px} .editor-area::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
  .no-select-msg{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:var(--text-muted);font-size:14px}
  .no-select-msg .big{font-size:48px;opacity:.2}

  .card{background:var(--bg-card);border:1px solid var(--border);border-radius:6px;overflow:hidden;animation:fadeIn .2s ease}
  .card-header{padding:9px 16px;background:var(--bg-panel);border-bottom:1px solid var(--border);font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--text-muted);display:flex;align-items:center;gap:8px}
  .card-body{padding:16px}

  .form-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:14px}
  .field{display:flex;flex-direction:column;gap:5px}
  .field label{font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--text-muted)}
  .field input,.field select{background:var(--bg-deep);border:1px solid var(--border);border-radius:4px;padding:7px 10px;font-family:var(--mono);font-size:13px;color:var(--text);outline:none;transition:border-color .15s}
  .field input:focus,.field select:focus{border-color:var(--amber)}
  .field select option{background:var(--bg-deep)}

  /* Schematic */
  .schematic-svg-wrap{width:100%;background:var(--bg-deep);border:1px solid var(--border);border-radius:6px;overflow:hidden;position:relative}
  .schematic-svg-wrap svg{display:block;touch-action:none;width:100%;height:100%}
  .sch-controls{display:flex;gap:6px;align-items:center;margin-top:8px;flex-wrap:wrap}
  .sch-size-btn{padding:3px 8px;border-radius:3px;border:1px solid var(--border);background:var(--bg-deep);color:var(--text-muted);font-family:var(--mono);font-size:11px;cursor:pointer;transition:all .12s}
  .sch-size-btn:hover{border-color:var(--border-lit);color:var(--text)}
  .sch-size-btn.active{background:var(--bg-hover);color:var(--text);border-color:var(--border-lit)}
  .conn-table-wrap{flex:1;min-width:260px;overflow-x:auto}
  .conn-table{width:100%;border-collapse:collapse;font-size:12px}
  .conn-table th{background:var(--bg-deep);color:var(--text-muted);font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;padding:6px 8px;text-align:left;border-bottom:1px solid var(--border);white-space:nowrap}
  .conn-table td{padding:4px 8px;border-bottom:1px solid rgba(45,55,72,.5);vertical-align:middle;font-family:var(--mono);white-space:nowrap}
  .conn-table tr:hover td{background:var(--bg-hover)}
  .link-badge{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:11px;font-family:var(--mono);font-size:11px;font-weight:700;border:1.5px solid}
  .dir-badge{display:inline-block;padding:1px 6px;border-radius:3px;font-size:10px;background:var(--bg-deep);border:1px solid var(--border);color:var(--text-dim)}
  .no-data-note{font-size:12px;color:var(--text-muted);font-family:var(--mono);line-height:1.6}
  .phase-strip{display:flex;gap:4px;flex-wrap:wrap;align-items:center}
  .phase-pill{padding:3px 10px;border-radius:12px;border:1px solid var(--border);background:var(--bg-deep);color:var(--text-muted);font-family:var(--mono);font-size:11px;cursor:pointer;transition:all .12s}
  .phase-pill:hover{border-color:var(--border-lit);color:var(--text)}
  .phase-pill.active{background:var(--amber);color:#000;border-color:var(--amber);font-weight:700}

  /* Phase table */
  .phase-toolbar{display:flex;gap:8px;align-items:center;margin-bottom:10px;flex-wrap:wrap}
  .phase-info{margin-left:auto;font-size:12px;color:var(--text-muted);font-family:var(--mono)}
  .phase-table-wrap{overflow-x:auto}
  .phase-table{width:100%;border-collapse:collapse;font-size:13px}
  .phase-table th{background:var(--bg-deep);color:var(--text-muted);font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;padding:7px 9px;text-align:left;border-bottom:1px solid var(--border);white-space:nowrap}
  .phase-table td{padding:4px 7px;border-bottom:1px solid var(--border);vertical-align:middle}
  .phase-table tr:last-child td{border-bottom:none}
  .phase-table tr:hover td{background:var(--bg-hover)}
  .phase-idx{font-family:var(--mono);font-size:11px;color:var(--text-muted);text-align:center;width:32px}
  .dur-input{background:var(--bg-deep);border:1px solid var(--border);border-radius:3px;padding:4px 8px;width:68px;font-family:var(--mono);font-size:13px;color:var(--amber);outline:none;text-align:right}
  .dur-input:focus{border-color:var(--amber)}
  .state-input{background:var(--bg-deep);border:1px solid var(--border);border-radius:3px;padding:4px 10px;width:100%;min-width:160px;font-family:var(--mono);font-size:13px;color:var(--text);outline:none;letter-spacing:.08em}
  .state-input:focus{border-color:var(--blue)}

  /* Signal cells */
  .state-viz{display:flex;gap:2px;align-items:center}
  .sig-cell{width:15px;height:15px;border-radius:3px;flex-shrink:0;display:inline-flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:8px;font-weight:700;color:rgba(0,0,0,.75)}
  .sc-G{background:#22c55e}.sc-g{background:#15803d;color:#aaa}.sc-r{background:#ef4444}.sc-y{background:#eab308}.sc-Y{background:#ca8a04}.sc-u{background:#8b5cf6;color:#fff}.sc-o{background:#f97316}.sc-O{background:#c2410c}.sc-s{background:#06b6d4;color:#fff}.sc-w{background:#cbd5e1;color:#000}.sc-x{background:var(--border);color:var(--text-muted)}

  .phase-diagram{overflow-x:auto;padding-bottom:4px}
  .phase-diagram svg{display:block}

  .xml-pre{background:var(--bg-deep);border:1px solid var(--border);border-radius:4px;padding:12px;font-family:var(--mono);font-size:11px;color:var(--text-dim);white-space:pre;overflow-x:auto;max-height:200px;overflow-y:auto;line-height:1.6}
  .xml-kw{color:#60a5fa}.xml-attr{color:#a78bfa}.xml-val{color:var(--amber)}

  /* ── Signal Group Matrix (Links × Links, same-SG relation) ── */
  .sgm-wrap{margin-bottom:14px}
  .sgm-table{border-collapse:separate;border-spacing:0}
  .sgm-table td,.sgm-table th{padding:0;line-height:1}
  .sgm-corner{width:32px;height:32px}
  .sgm-rowlabel{font-family:var(--mono);font-size:10px;color:var(--text-muted);text-align:right;padding-right:6px;white-space:nowrap;max-width:90px;overflow:hidden;text-overflow:ellipsis;vertical-align:middle}
  .sgm-collabel-wrap{height:90px;width:32px;vertical-align:bottom;padding-bottom:4px;font-family:var(--mono);font-size:10px}
  .sgm-collabel-inner{writing-mode:vertical-rl;transform:rotate(180deg);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-height:86px;color:var(--text-muted);display:flex;align-items:center}
  .sgm-cell{
    width:32px;height:32px;cursor:pointer;
    border:1px solid var(--bg-deep);
    transition:filter .1s,border-color .1s;
    position:relative;
    display:table-cell;vertical-align:middle;text-align:center;
    background:var(--bg-deep);
  }
  .sgm-cell:hover{border-color:var(--border-lit)!important;z-index:2;filter:brightness(1.3)}
  .sgm-cell.diagonal{cursor:default}
  .sgm-cell.diagonal::after{content:'■';font-size:14px;color:rgba(255,255,255,.85)}
  .sgm-cell.direct::after{content:'●';font-size:16px;color:rgba(255,255,255,.9)}
  .sgm-cell.derived::after{content:'○';font-size:13px;color:rgba(255,255,255,.55)}
  .sgm-cell.empty{background:#1a2330}
  .sgm-cell.empty::after{content:'·';color:#2d3748;font-size:14px;line-height:1}
  .sgm-cell.singleton{background:var(--bg-deep);border-color:var(--bg-panel)}
  .sgm-cell.singleton::after{content:'■';font-size:10px;color:#4a5568}
  /* Components strip (below matrix) */
  .sgm-comps{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px;padding:10px;background:var(--bg-deep);border:1px solid var(--border);border-radius:4px}
  .sgm-comp{
    display:flex;align-items:center;gap:6px;
    padding:4px 8px 4px 4px;border-radius:4px;
    background:var(--bg-panel);border:1px solid var(--border);
  }
  .sgm-comp-swatch{width:14px;height:14px;border-radius:3px;flex-shrink:0}
  .sgm-comp-name{
    background:transparent;border:none;border-bottom:1px dashed var(--border);
    font-family:var(--mono);font-size:12px;color:var(--amber);
    padding:2px 3px;width:70px;outline:none;
    text-align:left;
  }
  .sgm-comp-name:focus{border-bottom-color:var(--amber);background:var(--bg-deep)}
  .sgm-comp-name.mixed{color:var(--red);border-bottom-color:rgba(240,80,80,.5)}
  .sgm-comp-name::placeholder{color:var(--text-muted);font-style:italic}
  .sgm-comp-members{font-family:var(--mono);font-size:11px;color:var(--text-muted)}
  .sgm-comp.single{opacity:.6}
  .sgm-comp-btn{
    background:transparent;border:1px solid var(--border);border-radius:3px;
    color:var(--text-muted);font-size:10px;padding:2px 6px;cursor:pointer;
    font-family:var(--mono);line-height:1;
  }
  .sgm-comp-btn:hover{border-color:var(--red);color:var(--red)}
  .sgm-legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:10px;font-size:11px;color:var(--text-muted)}
  .sgm-legend-item{display:flex;align-items:center;gap:5px}
  .sgm-legend-swatch{width:16px;height:16px;border-radius:3px;display:inline-flex;align-items:center;justify-content:center;font-size:11px;color:#fff}

  /* ── Edit mode toggle (unified matrix) ── */
  .cm-mode-bar{
    display:flex;align-items:center;gap:6px;flex-wrap:wrap;
    padding:6px 10px;margin-bottom:10px;
    background:var(--bg-deep);border:1px solid var(--border);border-radius:5px;
  }
  .cm-mode-label{font-size:11px;color:var(--text-muted);font-family:var(--mono);margin-right:4px}
  .cm-mode-btn:hover{color:var(--text);border-color:var(--border-lit)}

  /* ── Unified cell sg-member rendering (on top of cm-cell base) ── */
  .cm-cell.sg-direct{cursor:default}
  .cm-cell.sg-direct::after{content:'●';font-size:16px;color:rgba(255,255,255,.9)}
  .cm-cell.sg-derived{cursor:default}
  .cm-cell.sg-derived::after{content:'○';font-size:13px;color:rgba(255,255,255,.55)}
  .cm-cell.sg-diag{cursor:default}
  .cm-cell.sg-diag::after{content:'■';font-size:14px;color:rgba(255,255,255,.85)}
  .cm-cell.sg-single-diag{cursor:default;background:var(--bg-panel)}
  .cm-cell.sg-single-diag::after{content:'■';font-size:10px;color:#4a5568}
  /* Highlight active-mode hoverability */

  /* ── Components strip (moved into cm card) ── */
  .sg-table{width:100%;border-collapse:collapse;font-size:13px}
  .sg-table th{background:var(--bg-deep);color:var(--text-muted);font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;padding:7px 9px;text-align:left;border-bottom:1px solid var(--border);white-space:nowrap}
  .sg-table td{padding:3px 7px;border-bottom:1px solid rgba(45,55,72,.4);vertical-align:middle}
  .sg-table tr:last-child td{border-bottom:none}
  .sg-table tr:hover td{background:var(--bg-hover)}
  .sg-idx{font-family:var(--mono);font-size:12px;color:var(--text-muted);width:42px;text-align:center}
  .sg-input{background:var(--bg-deep);border:1px solid var(--border);border-radius:3px;padding:4px 10px;width:100%;font-family:var(--mono);font-size:13px;color:var(--amber);outline:none;letter-spacing:.04em;transition:border-color .15s}
  .sg-input:focus{border-color:var(--amber);box-shadow:0 0 0 2px rgba(240,165,0,.15)}
  .sg-input::placeholder{color:var(--text-muted);font-style:italic}
  .sg-phases{display:flex;gap:2px;flex-wrap:nowrap}
  .sg-saved-badge{display:inline-flex;align-items:center;gap:5px;font-family:var(--mono);font-size:11px;color:var(--green);opacity:0;transition:opacity .4s}
  .sg-saved-badge.show{opacity:1}

  /* Conflict matrix */
  .cm-wrap{overflow-x:auto;padding-bottom:4px}
  .cm-table{border-collapse:collapse;font-size:11px}
  .cm-table td,.cm-table th{padding:0;line-height:1}
  .cm-corner{width:32px;height:32px}
  .cm-rowlabel{font-family:var(--mono);font-size:10px;color:var(--text-muted);text-align:right;padding-right:6px;white-space:nowrap;max-width:90px;overflow:hidden;text-overflow:ellipsis;vertical-align:middle}
  .cm-rowlabel span{color:var(--amber)}
  .cm-collabel-wrap{height:90px;width:32px;vertical-align:bottom;padding-bottom:4px;font-family:var(--mono);font-size:10px}
  .cm-collabel-inner{writing-mode:vertical-rl;transform:rotate(180deg);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-height:86px;color:var(--text-muted);display:flex;align-items:center}
  .cm-collabel-inner span{color:var(--amber)}
  /* Cell base */
  .cm-cell{
    width:32px;height:32px;cursor:pointer;
    border:1px solid var(--bg-deep);
    transition:background .1s,border-color .1s;
    position:relative;
    display:table-cell;vertical-align:middle;text-align:center;
  }
  .cm-cell:hover{border-color:var(--border-lit)!important;z-index:2;filter:brightness(1.2)}
  /* States */
  .cm-cell.diagonal{background:var(--bg-panel);cursor:default;border-color:var(--bg-panel)}
  .cm-cell.diagonal::after{content:'■';color:#2d3748;font-size:14px}
  .cm-cell.compat{background:#0d2b1a}
  .cm-cell.compat::after{content:'·';color:#1a4731;font-size:18px;line-height:1}
  .cm-cell.conflict{background:#3d0a0a}
  .cm-cell.conflict:hover{background:#5a0e0e}
  /* Intergreen value display — overrides ::after */
  .cm-cell.conflict .cm-val{
    display:flex;align-items:center;justify-content:center;
    width:100%;height:100%;
    font-family:var(--mono);font-weight:700;font-size:11px;
    color:#fca5a5;
  }
  .cm-cell.conflict.geo .cm-val{color:#fca5a5}
  .cm-cell.conflict.img .cm-val{color:#fde68a}  /* amber = came from image */
  .cm-cell.compat .cm-val,.cm-cell.diagonal .cm-val{display:none}
  /* Input popup for editing value */
  .cm-edit-popup{
    position:fixed;z-index:200;
    background:var(--bg-panel);border:1px solid var(--border-lit);
    border-radius:5px;padding:10px 12px;
    display:flex;flex-direction:column;gap:8px;
    box-shadow:0 8px 24px rgba(0,0,0,.5);
    min-width:200px;
  }
  .cm-edit-popup label{font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--text-muted)}
  .cm-edit-popup input{background:var(--bg-deep);border:1px solid var(--border);border-radius:3px;padding:5px 8px;font-family:var(--mono);font-size:14px;color:var(--amber);outline:none;width:100%;text-align:center}
  .cm-edit-popup input:focus{border-color:var(--amber)}
  .cm-edit-btns{display:flex;gap:6px}
  /* Image import area */

<body>

<header>
  <div class="logo">
    <div class="logo-signal">
      <div class="sig-dot sig-r"></div><div class="sig-dot sig-y"></div><div class="sig-dot sig-g"></div>
    </div>

  </div>
  <div class="header-meta" id="headerMeta">no file loaded</div>
</header>

<div class="toolbar">
  <input type="file" id="fileInput" accept=".xml,.net.xml" style="display:none">
  <button class="btn btn-primary" onclick="document.getElementById('fileInput').click()">📂 Load .net.xml</button>
  <div class="toolbar-sep"></div>
  <button class="btn btn-success" id="btnExport" onclick="exportXML()" disabled>⬇ Export Modified XML</button>
  <div class="toolbar-sep"></div>

  <button class="btn btn-danger" id="btnDeleteTLS" onclick="deleteCurrentTLS()" disabled>✕ Delete TLS</button>

      </div>
    </div>
  </div>

    <div class="editor-area" id="editorArea">
      <div class="no-select-msg"><div class="big">🚦</div><div>Select a TLS from the list to edit</div></div>
    </div>
  </div>
</div>

<div class="status-bar">
  <span id="statusMsg" class="status-ok">Ready</span>
  <span id="statusPhases"></span>
  <span id="statusCycle"></span>
</div>

<script>
// Oranjegeel per signaalgroep. Standaard volgens de snelheid van de inkomende rijstrook
// (Vlaanderen): <= 50 km/u 3 s, 70 km/u 4 s, 90 km/u 5 s. Fietsers 3 s, voetgangers 0 s (geen geel).
const IG_YELLOW_DEFAULT = 3;
function groupKeyOf(t, li) { const n = (t.signalGroups?.[li] || '').trim(); return n || `L${li}`; }
function groupMembers(t, key) {
  const nL = t.phases[0]?.state?.length || 0;
  return Array.from({length:nL}, (_, li) => li).filter(li => groupKeyOf(t, li) === key);
}
function groupKeys(t) {
  const nL = t.phases[0]?.state?.length || 0, seen = [];
  for (let li = 0; li < nL; li++) { const k = groupKeyOf(t, li); if (!seen.includes(k)) seen.push(k); }
  return seen;
}
function defaultYellowOfLinkRaw(t, li) {
  const type = getLinkTypes(t.id)[li];
  if (type === 'ped') return 0;
  if (type === 'bike') return 3;
  const c = (connectionsByTLS[t.id] || []).find(c => c.linkIndex === li);
  const v = (c && laneMap[`${c.from}_${c.fromLane}`]?.speed) || 13.89;
  return v <= 14.0 ? 3 : (v <= 19.5 ? 4 : 5);
}
function defaultYellowOfGroup(t, key) {
  return Math.max(0, ...groupMembers(t, key).map(li => defaultYellowOfLinkRaw(t, li)));
}
function yellowOfGroup(t, key) {
  const v = t.yellowByGroup?.[key];
  return (v !== undefined && v !== null && v !== '' && !isNaN(v)) ? Number(v) : defaultYellowOfGroup(t, key);
}
function yellowOfLink(t, li) { return yellowOfGroup(t, groupKeyOf(t, li)); }
function upsertTlsParam(t, key, val) {
  let node = null;
  t.tlLogicNode.querySelectorAll('param').forEach(p => { if (p.getAttribute('key') === key) node = p; });
  if (val) {
    if (!node) {
      node = xmlDoc.createElement('param');
      node.setAttribute('key', key);
      t.tlLogicNode.insertBefore(node, t.tlLogicNode.querySelector('phase') || null);
    }
    node.setAttribute('value', val);
  } else if (node) t.tlLogicNode.removeChild(node);
}
function setGroupYellow(i, key, v) {
  const t = tlsData[i]; if (!t) return;
  if (!t.yellowByGroup) t.yellowByGroup = {};
  if (v === '' || v === null) delete t.yellowByGroup[key];
  else t.yellowByGroup[key] = Math.max(0, Number(v) || 0);
  upsertTlsParam(t, 'yellowTimes', Object.entries(t.yellowByGroup).map(([k, x]) => `${k}:${x}`).join(','));
  if (t.phaseDesign) { recomputeInterstages(i); savePhaseDesign(i); renderPhaseDesign(i); }
  refreshXML(t);
}

// ── Global state ──────────────────────────────────────────────────────
let xmlDoc = null, originalFileName = '';
let tlsData = [], selectedIndex = -1, schematicPhase = 0, schematicSize = 360;
let schZoom = { scale: 1, tx: 0, ty: 0 };
let cmZoom  = { scale: 1, tx: 0, ty: 0 };

// Network geometry
let junctionMap    = {};  // jId → {x,y}
let junctionShapes = {};  // jId → [[x,y],…]  (outline polygon)
let edgeMap        = {};  // eId → {from, to}
let crossingEdgesMap = {};  // crossing-edge-id → [overgestoken edges]
let laneMap        = {};  // laneId → {shape:[[x,y],…], edgeId, index, width}
let internalNextLane = {};  // internal laneId → next internal laneId (for chaining)
let edgeLaneIds    = {};  // eId → [laneId,…] sorted by index
let connectionsByTLS = {}; // tlsId → [{from,to,fromLane,toLane,linkIndex,dir},…]

const SIG_COLORS = {G:'#22c55e',g:'#15803d',r:'#ef4444',y:'#eab308',Y:'#ca8a04',u:'#8b5cf6',o:'#f97316',O:'#c2410c',s:'#06b6d4',w:'#cbd5e1'};
const SIG_INFO   = {G:'Green priority',g:'Green no-priority',r:'Red',y:'Yellow',Y:'Yellow priority',u:'Off blink',o:'Off',O:'Off 2',s:'Stop-and-go',w:'Yellow blink'};
const sigCls = c => ({G:'sc-G',g:'sc-g',r:'sc-r',y:'sc-y',Y:'sc-Y',u:'sc-u',o:'sc-o',O:'sc-O',s:'sc-s',w:'sc-w'}[c]||'sc-x');

// ── File loading ──────────────────────────────────────────────────────
document.getElementById('fileInput').addEventListener('change', e => {
  const f = e.target.files[0]; if (!f) return;
  new FileReader().onload = ev => parseNetXML(ev.target.result, f.name),
  (function(){ const r = new FileReader(); r.onload = ev => parseNetXML(ev.target.result, f.name); r.readAsText(f); })();
  e.target.value = '';
});

['dragover','dragleave','drop'].forEach(ev =>
  document.querySelector('.panel-left').addEventListener(ev, e => {
    e.preventDefault();
    const dz = document.getElementById('dropZone');
    if (dz) dz.classList.toggle('drag-over', e.type === 'dragover');
    if (e.type === 'drop') {
      const f = e.dataTransfer.files[0]; if (!f) return;
      const r = new FileReader(); r.onload = ev => parseNetXML(ev.target.result, f.name); r.readAsText(f);
    }
  })
);

function parseShape(str) {
  if (!str || !str.trim()) return [];
  return str.trim().split(/\s+/).map(s => {
    const [x,y] = s.split(',').map(Number);
    return [x, y];
  }).filter(([x,y]) => isFinite(x) && isFinite(y));
}

function parseNetXML(text, name) {
  try {
    const parser = new DOMParser();
    xmlDoc = parser.parseFromString(text, 'text/xml');
    const err = xmlDoc.querySelector('parsererror');
    if (err) throw new Error(err.textContent.slice(0,120));

    originalFileName = name;
    tlsData = []; junctionMap = {}; junctionShapes = {}; edgeMap = {};
    laneMap = {}; edgeLaneIds = {}; connectionsByTLS = {}; internalNextLane = {}; crossingEdgesMap = {};

    // ── Junctions ──
    xmlDoc.querySelectorAll('junction').forEach(j => {
      const id = j.getAttribute('id');
      junctionMap[id] = { x: parseFloat(j.getAttribute('x'))||0, y: parseFloat(j.getAttribute('y'))||0 };
      const sh = parseShape(j.getAttribute('shape') || '');
      if (sh.length >= 3) junctionShapes[id] = sh;
    });

    // ── All lanes (including internal :junction edges) ──
    xmlDoc.querySelectorAll('edge > lane').forEach(lane => {
      const laneId = lane.getAttribute('id');
      const edgeNode = lane.parentElement;
      const edgeId = edgeNode.getAttribute('id');
      const shape = parseShape(lane.getAttribute('shape') || '');
      const idx   = parseInt(lane.getAttribute('index')) || 0;
      const width = parseFloat(lane.getAttribute('width')) || 3.2;
      const allow    = lane.getAttribute('allow')    || '';
      const disallow = lane.getAttribute('disallow') || '';
      const speed = parseFloat(lane.getAttribute('speed')) || 13.89;
      laneMap[laneId] = { shape, edgeId, index: idx, width, allow, disallow, speed };
      if (!edgeLaneIds[edgeId]) edgeLaneIds[edgeId] = [];
      edgeLaneIds[edgeId].push(laneId);
    });
    // Sort each edge's lanes by index
    Object.values(edgeLaneIds).forEach(arr => arr.sort((a,b) => (laneMap[a]?.index||0) - (laneMap[b]?.index||0)));

    // ── Edges (non-internal only for from/to lookup) ──
    xmlDoc.querySelectorAll('edge').forEach(e => {
      const id = e.getAttribute('id');
      if (id && !id.startsWith(':'))
        edgeMap[id] = { from: e.getAttribute('from')||'', to: e.getAttribute('to')||'' };
      if (id && e.getAttribute('function') === 'crossing')
        crossingEdgesMap[id] = (e.getAttribute('crossingEdges') || '').split(/\s+/).filter(Boolean);
    });

    // ── Connections with TLS ──
    xmlDoc.querySelectorAll('connection[tl]').forEach(c => {
      const tl = c.getAttribute('tl');
      if (!connectionsByTLS[tl]) connectionsByTLS[tl] = [];
      connectionsByTLS[tl].push({
        from: c.getAttribute('from')||'', to: c.getAttribute('to')||'',
        fromLane: parseInt(c.getAttribute('fromLane'))||0,
        toLane:   parseInt(c.getAttribute('toLane'))||0,
        linkIndex:parseInt(c.getAttribute('linkIndex'))||0,
        dir:      c.getAttribute('dir')||'',
        via:      c.getAttribute('via')||''   // internal lane id for conflict geometry
      });
    });

    // ── Internal lane chaining ──
    // Two cases produce a chain link:
    //   Case A: from=":X" to=":Y"                    → fromLane → toLane (classic internal→internal)
    //   Case B: from=":X" to="anything" via=":Y_n_m" → fromLane → viaLane
    //           (internal edge continues through an internal junction before reaching the real exit)
    xmlDoc.querySelectorAll('connection').forEach(c => {
      const from = c.getAttribute('from') || '';
      if (!from.startsWith(':')) return;  // must start from an internal edge

      const via     = c.getAttribute('via') || '';
      const to      = c.getAttribute('to')  || '';
      const fromLane = parseInt(c.getAttribute('fromLane')) || 0;
      const fromLaneId = (edgeLaneIds[from] || [])[fromLane] || (from + '_' + fromLane);

      if (via.startsWith(':') && laneMap[via]) {
        // Case B: the via IS the next internal lane — use it directly
        internalNextLane[fromLaneId] = via;
      } else if (to.startsWith(':')) {
        // Case A: classic internal→internal, no via (or via is not an internal lane)
        const toLane   = parseInt(c.getAttribute('toLane')) || 0;
        const toLaneId = (edgeLaneIds[to] || [])[toLane] || (to + '_' + toLane);
        internalNextLane[fromLaneId] = toLaneId;
      }
    });

    // ── TLS Logic ──
    xmlDoc.querySelectorAll('tlLogic').forEach(node => {
      const phases = [];
      node.querySelectorAll('phase').forEach(ph => phases.push({
        duration: ph.getAttribute('duration')||'0', minDur: ph.getAttribute('minDur')||'',
        maxDur:   ph.getAttribute('maxDur')||'',    state:  ph.getAttribute('state')||'',
        name:     ph.getAttribute('name')||''
      }));
      // Parse stored signal group mapping from <param key="signalGroups" value="0:VK1,1:A1,..."/>
      const signalGroups = {};
      // Parse stored signal group pairs (direct edges) from
      // <param key="signalGroupPairs" value="0-1,2-5,..."/>.
      // When present, this is authoritative for the edge graph; otherwise we
      // fall back to deriving edges from duplicate names (backward compat).
      let signalGroupPairsRaw = null;
      // Parse stored conflict matrix from <param key="conflictMatrix" value="0-1,0-3,1-2,..."/>
      let conflictMatrix = null;
      let pdAssignRaw='', pdStagesRaw='', pdIGRaw='', pdLinkedRaw='';
      node.querySelectorAll('param').forEach(p => {
        const key = p.getAttribute('key'), val = p.getAttribute('value')||'';
        if (key === 'signalGroups') {
          val.split(',').forEach(pair => {
            const ci = pair.indexOf(':');
            if (ci > 0) signalGroups[parseInt(pair.slice(0,ci))] = pair.slice(ci+1).trim();
          });
        }
        if (key === 'conflictMatrix')  conflictMatrix = val;
        if (key === 'signalGroupPairs') signalGroupPairsRaw = val;
        if (key === 'phaseAssignment') pdAssignRaw    = val;
        if (key === 'stageParams')     pdStagesRaw    = val;
        if (key === 'interstageParams')pdIGRaw        = val;
        if (key === 'linkedGroups')    pdLinkedRaw    = val;
      });
      tlsData.push({ id: node.getAttribute('id')||'', type: node.getAttribute('type')||'static',
        programID: node.getAttribute('programID')||'0', offset: node.getAttribute('offset')||'0',
        phases, signalGroups, sgPairs: new Set(), conflictMatrix: null, phaseDesign: null, tlLogicNode: node,
        yellowByGroup: Object.fromEntries((([...node.querySelectorAll('param')].find(p => p.getAttribute('key')==='yellowTimes')?.getAttribute('value')) || '')
          .split(',').filter(x => x.includes(':')).map(x => { const k = x.lastIndexOf(':'); return [x.slice(0, k), parseFloat(x.slice(k + 1))]; })) });

      // Resolve signal-group pair graph: explicit param wins; otherwise
      // derive from duplicate names so existing files keep working.
      {
        const _entry = tlsData[tlsData.length-1];
        const _nL = phases[0]?.state?.length || 0;
        if (signalGroupPairsRaw !== null) {
          signalGroupPairsRaw.split(',').forEach(tok => {
            const [a, b] = tok.split('-').map(Number);
            if (!isNaN(a) && !isNaN(b) && a !== b && a < _nL && b < _nL) {
              const lo = Math.min(a, b), hi = Math.max(a, b);
              _entry.sgPairs.add(`${lo}-${hi}`);
            }
          });
        } else {
          const _nameToLinks = {};
          Object.entries(signalGroups).forEach(([li, name]) => {
            const n = (name||'').trim();
            if (!n) return;
            (_nameToLinks[n] ||= []).push(parseInt(li));
          });
          Object.values(_nameToLinks).forEach(links => {
            for (let a=0; a<links.length; a++)
              for (let b=a+1; b<links.length; b++) {
                const lo=Math.min(links[a],links[b]), hi=Math.max(links[a],links[b]);
                _entry.sgPairs.add(`${lo}-${hi}`);
              }
          });
        }
      }

      // Resolve conflict matrix
      const entry = tlsData[tlsData.length-1];
      const nL = phases[0]?.state?.length || 0;
      if (typeof conflictMatrix === 'string' && nL > 0) {
        entry.conflictMatrix = makeZeroMatrix(nL);
        if (conflictMatrix) {
          conflictMatrix.split(',').forEach(pair => {
            const eqIdx = pair.indexOf('=');
            const pairPart = eqIdx >= 0 ? pair.slice(0, eqIdx) : pair;
            const valTxt = eqIdx >= 0 ? pair.slice(eqIdx+1) : '1';
            const [vab, vba] = valTxt.includes('/') ? valTxt.split('/').map(parseFloat) : [parseFloat(valTxt), parseFloat(valTxt)];
            const [a, b] = pairPart.split('-').map(Number);
            if (!isNaN(a) && !isNaN(b) && a < nL && b < nL && (vab > 0 || vba > 0)) {
              entry.conflictMatrix[a][b] = vab || vba;
              entry.conflictMatrix[b][a] = vba || vab;
            }
          });
        }
      }
      // Resolve phase design
      if (pdAssignRaw && nL > 0) {
        const assignment = pdAssignRaw.split(',').map(Number);
        const numStages = Math.max(...assignment.filter(v=>!isNaN(v))) + 1 || 1;
        const stages = pdStagesRaw ? pdStagesRaw.split(',').map(s=>{const[mn,mx]=s.split(':').map(Number);return{minGreen:mn||15,maxGreen:mx||60};})
                                   : Array.from({length:numStages},()=>({minGreen:15,maxGreen:60}));
        const igDurs = pdIGRaw ? pdIGRaw.split(',').map(Number) : Array.from({length:numStages},()=>4);
        const interstages = igDurs.map((d,p)=>({
          duration: d||4, override: true,
          computed: entry.conflictMatrix ? computeIntergreenRaw(entry.conflictMatrix,nL,assignment,p,(p+1)%numStages) : d
        }));
        entry.phaseDesign = {assignment, stages, interstages, linkedGroups: []};
        // Resolve linked groups: "0+3,1+4" → [[0,3],[1,4]]
        if (pdLinkedRaw) {
          pdLinkedRaw.split(',').forEach(grp => {
            const ids = grp.split('+').map(Number).filter(n => !isNaN(n) && n < nL);
            if (ids.length >= 2) entry.phaseDesign.linkedGroups.push(ids);
          });
        }
      }
    });

    selectedIndex = -1; schematicPhase = 0;
    renderList(); showEditor(-1); updateToolbar();
    document.getElementById('headerMeta').textContent = `${name} · ${tlsData.length} TLS · ${Object.keys(junctionMap).length} junctions`;
    document.getElementById('fileNameLabel').textContent = name;
    document.getElementById('tlsCountBadge').textContent = `${tlsData.length} TLS loaded`;
    setStatus(`Loaded ${tlsData.length} TLS · ${Object.keys(laneMap).length} lanes from ${name}`, 'ok');
  } catch(ex) { setStatus('Error: '+ex.message,'err'); alert('Error:\n'+ex.message); }
}

// ── Junction SVG from actual network geometry ──────────────────────────
//
// Renders the real SUMO lane shapes for all approaches and departures,
// the junction outline polygon, internal turning-movement lanes, and
// link-index badges on the stop-line end of each controlled lane.
//
function buildJunctionSVG(tls, phIdx, svgW, svgH, mini) {
  const svgSize = Math.min(svgW, svgH);  // keep scale based on shorter dimension
  const jId   = tls.id;
  const conns = (connectionsByTLS[jId]||[]).slice().sort((a,b) => a.linkIndex - b.linkIndex);
  const phase = tls.phases[phIdx] || tls.phases[0];
  const stateStr = phase?.state || '';

  // Map controlled approach lanes: "edgeId_laneIndex" → {linkIndex, signal}
  const ctrlLane = {};
  conns.forEach(c => {
    ctrlLane[c.from + '_' + c.fromLane] = { linkIndex: c.linkIndex, signal: stateStr[c.linkIndex] ?? '?' };
  });

  // Internal edge ids for this junction (approach/depart edges no longer rendered)
  const internalEdgeIds = Object.keys(edgeLaneIds).filter(id => id.startsWith(':' + jId));

  // ── Collect bounding box from via-lane shapes only ──
  const allPts = [];
  const jShape = junctionShapes[jId] || [];
  // Use all internal lanes for this junction (via-lanes define the extent)
  const intPrefix2 = ':' + jId;
  Object.keys(edgeLaneIds).filter(id => id.startsWith(intPrefix2)).forEach(eid => {
    (edgeLaneIds[eid]||[]).forEach(lid => { const ln = laneMap[lid]; if (ln) allPts.push(...ln.shape); });
  });
  // Fallback to junction centroid if no internal geometry
  const junc2 = junctionMap[jId];
  const junc  = junc2;  // alias for rest of function
  if (allPts.length < 2 && junc2) allPts.push([junc2.x-10,junc2.y-10],[junc2.x+10,junc2.y+10]);

  // If no geometry at all, show a text label
  // (junc already defined above)
  if (allPts.length < 2) {
    const cx = svgSize/2, cy = svgSize/2;
    return `<rect width="${svgW}" height="${svgH}" fill="#0d1117"/>
      <circle cx="${svgW/2}" cy="${svgH/2}" r="${svgSize*0.12}" fill="#161b22" stroke="#3d4f6a" stroke-width="2"/>
      <text x="${svgW/2}" y="${svgH/2}" text-anchor="middle" dominant-baseline="middle" fill="#6b7280" font-size="10" font-family="monospace">no geometry</text>`;
  }

  // ── Bounding box & transform ──
  let xmin=Infinity,xmax=-Infinity,ymin=Infinity,ymax=-Infinity;
  allPts.forEach(([x,y])=>{ xmin=Math.min(xmin,x);xmax=Math.max(xmax,x);ymin=Math.min(ymin,y);ymax=Math.max(ymax,y); });

  const PAD  = mini ? svgSize*0.07 : svgSize*0.09;
  const drawW = svgW - 2*PAD, drawH = svgH - 2*PAD;
  const rangeX = xmax-xmin||1, rangeY = ymax-ymin||1;
  const scale  = Math.min(drawW/rangeX, drawH/rangeY);
  const offX   = PAD + (drawW - rangeX*scale)/2;
  const offY   = PAD + (drawH - rangeY*scale)/2;

  // SUMO: Y increases upward. SVG: Y increases downward. → flip Y.
  const tx  = x => offX + (x - xmin) * scale;
  const ty  = y => svgH - offY - (y - ymin) * scale;
  const pts2poly = pts => pts.map(([x,y]) => `${tx(x).toFixed(1)},${ty(y).toFixed(1)}`).join(' ');
  const pts2line = pts => pts.map(([x,y],i) => `${i?'L':'M'}${tx(x).toFixed(1)},${ty(y).toFixed(1)}`).join('');

  let s = `<rect width="${svgW}" height="${svgH}" fill="#0d1117"/>`;

  // Road geometry removed — only via-lanes are drawn

  // ── Internal (turning movement) via-lanes — coloured by signal state ──
  if (true) {  // render in both mini and full
    // Build map: via-lane startId → {linkIndex, signal, fullShape}
    const viaInfo = {};
    conns.forEach(c => {
      const sid = stateStr[c.linkIndex] ?? '?';
      const startId = (c.via && laneMap[c.via]) ? c.via
                    : ((c.to.startsWith(':') && laneMap[c.to + '_0']) ? c.to + '_0' : `:${jId}_${c.linkIndex}_0`);
      if (!laneMap[startId]) return;
      const fullShape = getFullViaShape(startId);
      if (fullShape.length >= 2)
        viaInfo[startId] = { li: c.linkIndex, sig: sid, shape: fullShape };
    });

    // Draw uncontrolled internal lanes first (faint, full-view only)
    if (!mini) internalEdgeIds.forEach(eid => {
      (edgeLaneIds[eid]||[]).forEach(lid => {
        if (viaInfo[lid]) return;  // controlled — drawn later
        const ln = laneMap[lid]; if (!ln||ln.shape.length<2) return;
        s += `<path d="${pts2line(ln.shape)}" fill="none" stroke="#2a3448" stroke-width="1" stroke-linecap="round" stroke-dasharray="3,4" opacity="0.4"/>`;
      });
    });

    // Draw controlled via-lanes coloured by signal state
    // Order: red first (background), then yellow, then green on top
    const ORDER = { r:0, R:0, u:0, y:1, Y:1, g:2, G:2, o:3, O:3, s:1 };
    const viaEntries = Object.entries(viaInfo)
      .map(([lid, inf]) => ({ lid, ...inf, ord: ORDER[inf.sig] ?? 0 }))
      .sort((a,b) => a.ord - b.ord);

    viaEntries.forEach(({ lid, li, sig, shape: viaShape }) => {
      if (!viaShape || viaShape.length < 2) return;
      // Use the full chained shape (not just the first hop from laneMap)
      const ln = { shape: viaShape, width: laneMap[lid]?.width || 3.2 };
      const col = SIG_COLORS[sig] || '#4b5563';
      const isGreen  = 'gGoO'.includes(sig);
      const isRed    = 'rRuU'.includes(sig);
      const lw = Math.max(isGreen ? 3.5 : 2.2, scale * (isGreen ? 0.75 : 0.55));
      const op = isRed ? 0.22 : (isGreen ? 0.96 : 0.78);

      // Glow for green/orange movements
      if (isGreen) {
        s += `<path d="${pts2line(ln.shape)}" fill="none" stroke="${col}" stroke-width="${(lw*4).toFixed(1)}" stroke-linecap="round" stroke-linejoin="round" opacity="0.10"/>`;
        s += `<path d="${pts2line(ln.shape)}" fill="none" stroke="${col}" stroke-width="${(lw*2.2).toFixed(1)}" stroke-linecap="round" stroke-linejoin="round" opacity="0.22"/>`;
      }
      if (mini) {
        // Mini: just a coloured line, no glow/arrow
        s += `<path d="${pts2line(ln.shape)}" fill="none" stroke="${col}" stroke-width="${Math.max(1.5, lw*0.55).toFixed(1)}" stroke-linecap="round" stroke-linejoin="round" opacity="${op}"/>`;
      } else {
        s += `<path d="${pts2line(ln.shape)}" fill="none" stroke="${col}" stroke-width="${lw.toFixed(1)}" stroke-linecap="round" stroke-linejoin="round" opacity="${op}"/>`;
      }

      // Arrowhead + badge: full view only
      if (!mini) {
      const n = ln.shape.length;
      const [ax1,ay1] = ln.shape[n-2], [ax2,ay2] = ln.shape[n-1];
      const dx=tx(ax2)-tx(ax1), dy=ty(ay2)-ty(ay1);
      const AS = Math.max(5, lw*2.2);
      const ex=tx(ax2), ey=ty(ay2);
      const ang=Math.atan2(dy,dx);
      s += `<polygon points="${ex.toFixed(1)},${ey.toFixed(1)} ${(ex-Math.cos(ang-0.38)*AS).toFixed(1)},${(ey-Math.sin(ang-0.38)*AS).toFixed(1)} ${(ex-Math.cos(ang+0.38)*AS).toFixed(1)},${(ey-Math.sin(ang+0.38)*AS).toFixed(1)}" fill="${col}" opacity="${op}"/>`;
      } // end arrow

      // Link-index badge at via-lane midpoint
      if (!mini) {
      const pts = ln.shape;
      const segsV=[]; let totV=0;
      for (let k=1;k<pts.length;k++) { const ddx=pts[k][0]-pts[k-1][0],ddy=pts[k][1]-pts[k-1][1]; const d=Math.sqrt(ddx*ddx+ddy*ddy); segsV.push(d); totV+=d; }
      const tgtV=totV*0.5; let accV=0, mx=pts[0][0], my=pts[0][1];
      for (let k=0;k<segsV.length;k++) { if(accV+segsV[k]>=tgtV){const tt=(tgtV-accV)/segsV[k]; mx=pts[k][0]+(pts[k+1][0]-pts[k][0])*tt; my=pts[k][1]+(pts[k+1][1]-pts[k][1])*tt; break;} accV+=segsV[k]; }
      const bx=tx(mx), by=ty(my);
      const BR = Math.max(6, Math.min(10, lw*1.8));
      s += `<circle cx="${bx.toFixed(1)}" cy="${by.toFixed(1)}" r="${BR.toFixed(1)}" fill="#0d1117" stroke="${col}" stroke-width="1.5" opacity="${isRed?0.45:0.95}"/>`;
      s += `<text x="${bx.toFixed(1)}" y="${by.toFixed(1)}" text-anchor="middle" dominant-baseline="middle" fill="${col}" font-size="${Math.max(6,BR*0.9).toFixed(1)}" font-family="monospace" font-weight="bold" opacity="${isRed?0.45:0.95}">${li}</text>`;
      } // end badge
    });
  }

  // Junction polygon removed — pure connection-lines view

  // (Stop-line bars and approach-lane badges removed — link indices now shown on via-lanes only)

  // ── Junction label (full view) ──
  if (!mini && junc) {
    const label = jId.length > 18 ? jId.slice(0,16)+'…' : jId;
    // Find a quiet spot: centroid of junction shape or junction centre
    let lcx, lcy;
    if (jShape.length >= 3) {
      lcx = jShape.reduce((s,[x])=>s+x,0)/jShape.length;
      lcy = jShape.reduce((s,[,y])=>s+y,0)/jShape.length;
    } else { lcx = junc.x; lcy = junc.y; }
    s += `<text x="${tx(lcx).toFixed(1)}" y="${ty(lcy).toFixed(1)}" text-anchor="middle" dominant-baseline="middle" fill="#94a3b8" font-size="9" font-family="monospace" opacity="0.8">${esc(label)}</text>`;
  }

  return s;
}

// ── List rendering ────────────────────────────────────────────────────
function renderList() {
  const list = document.getElementById('tlsList');
  const filter = document.getElementById('searchInput').value.toLowerCase();
  if (!tlsData.length) {
    list.innerHTML = `<div class="drop-zone"><div class="drop-zone-icon">🚦</div><h3>No TLS found</h3><p>No tlLogic elements in file</p></div>`;
    return;
  }
  list.innerHTML = tlsData.map((t,i) => {
    if (filter && !t.id.toLowerCase().includes(filter)) return '';
    const cycle = t.phases.reduce((s,p)=>s+parseFloat(p.duration||0),0);
    const nC = (connectionsByTLS[t.id]||[]).length;
    const inner = buildJunctionSVG(t, 0, 68, 68, true);
    const miniSvg = `<svg viewBox="0 0 68 68" xmlns="http://www.w3.org/2000/svg">${inner}</svg>`;
    return `<div class="tls-item ${i===selectedIndex?'active':''}" onclick="selectTLS(${i})">
      <div class="mini-junc">${miniSvg}</div>
      <div class="tls-item-info">
        <div class="tls-id" title="${esc(t.id)}">${esc(t.id)}</div>
        <div class="tls-meta">
          <span class="tag tag-type">${t.type}</span>
          <span class="tag tag-phases">${t.phases.length} ph</span>
          <span class="tag">${cycle}s</span>
          ${nC?`<span class="tag" style="border-color:#4b5563;color:#9ca3af">${nC} lnk</span>`:''}
        </div>
      </div>
    </div>`;
  }).join('');
}

// ── Schematic zoom / pan ──────────────────────────────────────────────
function initSchematicZoom(sw, sh) {
  const svg = document.getElementById('schSvg');
  if (!svg) return;

  const MIN_SCALE = 0.5, MAX_SCALE = 20;

  function applyTransform() {
    const g = document.getElementById('schZoomGroup');
    const lbl = document.getElementById('schZoomLabel');
    if (g)   g.setAttribute('transform', `translate(${schZoom.tx},${schZoom.ty}) scale(${schZoom.scale})`);
    if (lbl) lbl.textContent = 'x' + schZoom.scale.toFixed(schZoom.scale<10?2:1);
  }

  // Wheel → zoom centred on cursor
  svg.addEventListener('wheel', e => {
    e.preventDefault();
    const rect = svg.getBoundingClientRect();
    const mx = (e.clientX - rect.left) * (sw / rect.width);
    const my = (e.clientY - rect.top)  * (sh / rect.height);
    const factor = e.deltaY < 0 ? 1.15 : 1/1.15;
    const newScale = Math.max(MIN_SCALE, Math.min(MAX_SCALE, schZoom.scale * factor));
    const ratio = newScale / schZoom.scale;
    schZoom.tx = mx + (schZoom.tx - mx) * ratio;
    schZoom.ty = my + (schZoom.ty - my) * ratio;
    schZoom.scale = newScale;
    applyTransform();
  }, { passive: false });

  // Drag → pan
  let drag = null;
  svg.addEventListener('mousedown', e => {
    if (e.button !== 0) return;
    drag = { x: e.clientX, y: e.clientY, tx: schZoom.tx, ty: schZoom.ty };
    svg.style.cursor = 'grabbing';
  });
  window.addEventListener('mousemove', e => {
    if (!drag) return;
    const rect = svg.getBoundingClientRect();
    const scaleX = sw / rect.width;
    const scaleY = sh / rect.height;
    schZoom.tx = drag.tx + (e.clientX - drag.x) * scaleX;
    schZoom.ty = drag.ty + (e.clientY - drag.y) * scaleY;
    applyTransform();
  });
  window.addEventListener('mouseup', () => {
    if (drag) { drag = null; svg.style.cursor = 'grab'; }
  });

  // Double-click → reset
  svg.addEventListener('dblclick', () => {
    schZoom = { scale: 1, tx: 0, ty: 0 };
    applyTransform();
  });
}

// ── Signal Group Assignment (Links × Links matrix) ───────────────────
//
// Model:
//   t.sgPairs : Set of canonical "a-b" keys (a<b) — direct same-SG edges
//   Connected components of that graph = signal groups
//   t.signalGroups: {linkIdx: name} — name broadcast to all component members
//
// Click a cell to toggle the direct edge. Components are recomputed.
// Name a component to broadcast the name to all its member links. Multi-member
// components get an auto-name (SG1, SG2, …) if no member is named — this
// keeps the persisted <param key="signalGroups"> round-trippable.

function sgPairKey(a, b) {
  const lo = Math.min(a, b), hi = Math.max(a, b);
  return `${lo}-${hi}`;
}

function computeSgComponents(t, nL) {
  // Union-find over links
  const parent = Array.from({length: nL}, (_, k) => k);
  const find = x => (parent[x] === x ? x : (parent[x] = find(parent[x])));
  const union = (a, b) => { const ra = find(a), rb = find(b); if (ra !== rb) parent[ra] = rb; };
  (t.sgPairs || new Set()).forEach(key => {
    const [a, b] = key.split('-').map(Number);
    if (a < nL && b < nL) union(a, b);
  });
  // Map root -> members[]
  const byRoot = {};
  for (let i = 0; i < nL; i++) {
    const r = find(i);
    (byRoot[r] ||= []).push(i);
  }
  // Return array of member-arrays, sorted by smallest member for stable ordering
  return Object.values(byRoot).sort((a, b) => a[0] - b[0]);
}

// Deliberately does nothing. Previously this function broadcast one member's
// name to its groupmates and auto-generated "SG<k>" names for multi-link
// groups — but that meant a simple matrix click could silently overwrite
// user-set SG names. Names now only change when the user explicitly types
// one into a component's name input (handled in sgRenameComponent).
// Groupings are persisted independently in <param key="signalGroupPairs">.
function broadcastComponentNames(_t, _nL) { /* no-op */ }

// Reconcile pd.linkedGroups with the signal-group matrix. Every multi-link
// component in sgPairs becomes an authoritative linked group in the phase
// design — because links that share a signal, by definition, must always be
// assigned to the same stage. We also snap each linked member's stage
// assignment to the group's anchor so the phase assignment stays internally
// consistent when groupings change.
function syncLinkedGroupsFromSignalGroups(i) {
  const t = tlsData[i]; if (!t?.phaseDesign) return;
  const nL = t.phases[0]?.state?.length || 0;
  const sgComps = computeSgComponents(t, nL).filter(c => c.length >= 2);
  const newLinked = sgComps.map(c => [...c].sort((a, b) => a - b));
  t.phaseDesign.linkedGroups = newLinked;
  // Snap each linked group to the stage of its lowest-indexed member so
  // the assignment vector doesn't carry over stale per-link values after
  // the grouping changes.
  newLinked.forEach(grp => {
    const stage = t.phaseDesign.assignment[grp[0]] ?? 0;
    grp.forEach(m => { t.phaseDesign.assignment[m] = stage; });
  });
  // Re-compute interstage durations (they depend on stage membership).
  if (typeof recomputeInterstages === 'function') recomputeInterstages(i);
  savePhaseDesign(i);
}

// One stop for every post-sg-change refresh: sync the phase-design linked
// groups, persist signal-group XML, then redraw everything that shows
// signal-group data (unified matrix + components strip, diagram, phase design).
function afterSgChange(i) {
  const t = tlsData[i]; if (!t) return;
  syncLinkedGroupsFromSignalGroups(i);
  saveSignalGroupsToXML(i);
  renderConflictMatrix(i);  // unified: matrix + components strip
  renderDiagram(t);
  renderPhaseDesign(i);
}

function sgToggleEdge(i, a, b) {
  if (a === b) return;
  const t = tlsData[i]; if (!t) return;
  const key = sgPairKey(a, b);
  if (t.sgPairs.has(key)) t.sgPairs.delete(key);
  else t.sgPairs.add(key);
  afterSgChange(i);
}

function rebuildPairsFromNames(t) {
  const nL = t.phases[0]?.state?.length || 0, byName = {};
  for (let li = 0; li < nL; li++) {
    const n = (t.signalGroups[li] || '').trim();
    if (n) (byName[n] ||= []).push(li);
  }
  t.sgPairs = new Set();
  Object.values(byName).forEach(ls => {
    for (let a = 0; a < ls.length; a++) for (let b = a + 1; b < ls.length; b++) t.sgPairs.add(sgPairKey(ls[a], ls[b]));
  });
}

// Basisversie: de NAAM bepaalt de signaalgroep. Links met dezelfde naam = één groep.
function sgRenameComponent(i, sampleLink, newName) {
  const t = tlsData[i]; if (!t) return;
  const nL = t.phases[0]?.state?.length || 0;
  const comps = computeSgComponents(t, nL);
  const comp = comps.find(m => m.includes(sampleLink));
  if (!comp) return;
  const trimmed = (newName || '').trim();
  comp.forEach(m => {
    if (trimmed) t.signalGroups[m] = trimmed;
    else delete t.signalGroups[m];
  });
  rebuildPairsFromNames(t);
  afterSgChange(i);
}

function sgIsolateLink(i, li) {
  const t = tlsData[i]; if (!t) return;
  delete t.signalGroups[li];          // naam weg = link uit de groep
  rebuildPairsFromNames(t);
  afterSgChange(i);
}
